[package]
name = "jgenesis-libretro"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "jgenesis_libretro"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# QA only: runtime backend selection and opcode accounting.
jit-runtime = ["genesis-core/jit-runtime", "m68000-emu/jit-runtime", "sh2-emu/jit-runtime", "jgenesis-common/jit-runtime"]
jit-preview = ["jit-runtime", "m68000-emu/jit-preview", "sh2-emu/jit-preview", "jgenesis-common/jit-preview"]

[dependencies]
m68000-emu = { workspace = true, optional = true }
sh2-emu = { workspace = true, optional = true }
cdrom = { workspace = true }
crc = { workspace = true }
genesis-config = { workspace = true }
genesis-core = { workspace = true }
jgenesis-common = { workspace = true }
s32x-core = { workspace = true }
segacd-core = { workspace = true }
smsgg-config = { workspace = true }
smsgg-core = { workspace = true }

bincode = { workspace = true }
# Android release builds must not evaluate ordinary diagnostic arguments, even
# when a dependency/frontend raises the runtime logging filter.
log = { workspace = true, features = ["release_max_level_off"] }
zip = { workspace = true }

[lints]
workspace = true
