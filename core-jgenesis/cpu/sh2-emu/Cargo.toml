[package]
name = "sh2-emu"
version = { workspace = true }
edition = "2024"

[features]
jit-runtime = ["native-arm64", "jgenesis-common/jit-runtime"]
jit-preview = ["jit-runtime", "jgenesis-common/jit-preview"]
# Experimental, explicitly selected with Sh2::execute_with_native. Never default.
native-arm64 = ["jgenesis-common/native-code", "dep:rustc-hash"]

[dependencies]
jgenesis-common = { workspace = true }

bincode = { workspace = true, features = ["derive"] }
log = { workspace = true }
rustc-hash = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }

[lints]
workspace = true
