[package]
name = "sh2-difftest"
version = { workspace = true }
edition = "2024"
publish = false

# Host-only differential tester for the SH-2 block engine: runs real 32X ROMs through the
# interpreter and the block engine and compares them (see docs/SH2-JIT-DESIGN.md).

[features]
default = ["verify"]
# Lockstep verifier and block-engine statistics; disable for representative speed numbers
verify = ["sh2-emu/jit-verify"]

[dependencies]
genesis-config = { workspace = true }
genesis-core = { workspace = true }
jgenesis-common = { workspace = true }
s32x-core = { workspace = true }
sh2-emu = { workspace = true }

bincode = { workspace = true }

[lints]
workspace = true
